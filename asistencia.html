<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CONTACTO / RSVP</title>
        <!-- Fuente Retro DOS / IBM (VT323) -->
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
        <!-- Tu CSS Personalizado (asegurate de que la ruta coincida con tu estructura) -->
        <link rel="stylesheet" href="css/css.css">
    </head>
    <body class="contacto">
        <header>
            <img src="css/banner.jpg" alt="Banner de la página">
            <h1> Confirmá tu asistencia </h1>
            <nav>
                <a onmouseenter="reproducirSonido()" href="index.html">
                    Principal ▲
                </a>
            </nav>
        </header>
        <main>
            <section class="bordemain">
                <h2>Formulario</h2>
                <p>Rellená este formulario para confirmar tu asistencia y pasame el mensaje por WhatsApp!</p>
                
                <!-- enviarWhatsApp(event) -->
                <form id="rsvpForm" onsubmit="enviarWhatsApp(event)">
                    <fieldset>
                        <legend>Datos personales</legend>
                        <label for="nombre">Nombre*</label>
                        <input type="text" id="nombre" name="nombre" placeholder="nombre" required>
                    </fieldset>

                    <fieldset>
                        <legend>Asisto, acudo?</legend>
                        <label for="asistencia">Venís?*</label>
                        <select id="asistencia" name="asistencia" required>
                            <option value="">Selecciona una opción</option>
                            <option value="sí">sí</option>
                            <option value="no">no</option>
                            <option value="no, te odio">no, te odio</option>
                            <option value="la 3era opcion">la 3era opcion</option>
                            <option value="todas menos la 1era">todas menos la 1era</option>
                        </select>
                        
                        <label for="mensaje">Mensajito</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí cualquier pelotudez si querés"></textarea>
                    </fieldset>

                    <div style="text-align: center;">
                        <button type="submit" onmouseenter="reproducirSonido()">Terminé</button>
                        <button type="reset" onmouseenter="reproducirSonido()">Resetear formulario (ahre para qué)</button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <img src="css/banner.jpg" alt="Banner de la página">
            <a onmouseenter="reproducirSonido()" href="easteregg.html">
                    Septiembre 30 2005
                </a>
        </footer>
        <!-- Script para generar mensaje -->
        <script>
            function enviarWhatsApp(event) {
                event.preventDefault(); // Evita recargar la página
                const nombre = document.getElementById('nombre').value;
                const asistencia = document.getElementById('asistencia').value;
                const mensaje = document.getElementById('mensaje').value;
                const NumeroRober = "5493516871262"; 

                // texto predeterminado que se va a enviar solo
                const texto = `Confirmación de asistencia:\n\n*Nombre:* ${nombre}\n*¿Venís?:* ${asistencia}\n*Mensajito:* ${mensaje || "(Sin mensaje)"}`;

                //texto codificado para url
                const textoCodificado = encodeURIComponent(texto);

                //link universal de WhatsApp
                const urlWhatsApp = `https://api.whatsapp.com/send?phone=${NumeroRober}&text=${textoCodificado}`;

                // Los redirige automáticamente a WhatsApp con el mensaje escrito
                window.location.href = urlWhatsApp;
            }

            function reproducirSonido() {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            }
        </script>
    </body>
</html>
